<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#121212" />
  <title>Dump</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      padding: 16px;
      padding-top: env(safe-area-inset-top, 16px);
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .status {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #757575;
    }
    .actions button {
      background: #242424;
      border: 1px solid #333;
      color: #bbb;
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 6px;
    }
    .actions button:active { background: #333; }
    textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f5f5f5;
      font-size: 1.05rem;
      line-height: 1.5;
      resize: none;
      font-family: inherit;
    }
    textarea::placeholder { color: #444; }
  </style>
</head>
<body>
  <header>
    <span id="status" class="status">Saved</span>
    <div class="actions">
      <button id="copyBtn">Copy</button>
      <button id="clearBtn">Clear</button>
    </div>
  </header>
  <textarea id="pad" placeholder="Dump raw thoughts here..." autofocus></textarea>

  <script>
    const pad = document.getElementById('pad');
    const status = document.getElementById('status');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');

    // Load saved content
    pad.value = localStorage.getItem('braindump_content') || '';

    // Auto-save on every keystroke
    pad.addEventListener('input', () => {
      localStorage.setItem('braindump_content', pad.value);
      status.textContent = 'Saving...';
      clearTimeout(window.saveTimer);
      window.saveTimer = setTimeout(() => {
        status.textContent = 'Saved';
      }, 400);
    });

    // Copy entire scratchpad
    copyBtn.addEventListener('click', async () => {
      if (!pad.value) return;
      await navigator.clipboard.writeText(pad.value);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
    });

    // Clear with confirmation
    clearBtn.addEventListener('click', () => {
      if (!pad.value) return;
      if (confirm('Clear pad?')) {
        pad.value = '';
        localStorage.removeItem('braindump_content');
        status.textContent = 'Cleared';
      }
    });
  </script>
</body>
</html>
