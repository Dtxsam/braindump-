<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#121212" />
  <title>Dump</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      padding: 16px;
      padding-top: env(safe-area-inset-top, 16px);
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .status {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #757575;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .actions button {
      background: #242424;
      border: 1px solid #333;
      color: #bbb;
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .actions button:active { background: #333; }
    
    #listContainer {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .checkbox {
      width: 22px;
      height: 22px;
      min-width: 22px;
      margin-top: 2px;
      border: 2px solid #555;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #1a1a1a;
      transition: all 0.15s ease;
    }
    .checkbox.checked {
      background: #3b82f6;
      border-color: #3b82f6;
    }
    .checkbox.checked::after {
      content: '✓';
      color: #fff;
      font-size: 14px;
      font-weight: bold;
    }
    .item-text {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f5f5f5;
      font-size: 1.05rem;
      line-height: 1.4;
      font-family: inherit;
      resize: none;
      overflow: hidden;
      min-height: 26px;
    }
    .item-text.checked {
      text-decoration: line-through;
      color: #666;
    }
    .item-text::placeholder { color: #444; }
  </style>
</head>
<body>
  <header>
    <span id="status" class="status">Saved</span>
    <div class="actions">
      <button id="addBtn">+ Item</button>
      <button id="copyBtn">Copy</button>
      <button id="clearBtn">Clear</button>
    </div>
  </header>

  <div id="listContainer"></div>

  <script>
    const container = document.getElementById('listContainer');
    const status = document.getElementById('status');
    const addBtn = document.getElementById('addBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');

    let items = JSON.parse(localStorage.getItem('braindump_tasks') || '[]');

    function saveItems() {
      localStorage.setItem('braindump_tasks', JSON.stringify(items));
      status.textContent = 'Saving...';
      clearTimeout(window.saveTimer);
      window.saveTimer = setTimeout(() => { status.textContent = 'Saved'; }, 300);
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function renderList() {
      container.innerHTML = '';
      if (items.length === 0) {
        items.push({ text: '', checked: false });
      }

      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox' + (item.checked ? ' checked' : '');
        checkbox.addEventListener('click', () => {
          item.checked = !item.checked;
          saveItems();
          renderList();
        });

        const textarea = document.createElement('textarea');
        textarea.rows = 1;
        textarea.className = 'item-text' + (item.checked ? ' checked' : '');
        textarea.placeholder = 'Type thought or task...';
        textarea.value = item.text;

        textarea.addEventListener('input', () => {
          item.text = textarea.value;
          autoResize(textarea);
          saveItems();
        });

        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            items.splice(index + 1, 0, { text: '', checked: false });
            saveItems();
            renderList();
            setTimeout(() => {
              const inputs = container.querySelectorAll('.item-text');
              if (inputs[index + 1]) inputs[index + 1].focus();
            }, 10);
          } else if (e.key === 'Backspace' && textarea.value === '' && items.length > 1) {
            e.preventDefault();
            items.splice(index, 1);
            saveItems();
            renderList();
            setTimeout(() => {
              const inputs = container.querySelectorAll('.item-text');
              const prev = inputs[Math.max(0, index - 1)];
              if (prev) {
                prev.focus();
                prev.selectionStart = prev.selectionEnd = prev.value.length;
              }
            }, 10);
          }
        });

        row.appendChild(checkbox);
        row.appendChild(textarea);
        container.appendChild(row);

        setTimeout(() => autoResize(textarea), 0);
      });
    }

    addBtn.addEventListener('click', () => {
      items.push({ text: '', checked: false });
      saveItems();
      renderList();
      setTimeout(() => {
        const inputs = container.querySelectorAll('.item-text');
        inputs[inputs.length - 1].focus();
      }, 20);
    });

    copyBtn.addEventListener('click', async () => {
      const exportText = items
        .filter(i => i.text.trim())
        .map(i => `${i.checked ? '[x]' : '[ ]'} ${i.text}`)
        .join('\n');
      if (!exportText) return;
      await navigator.clipboard.writeText(exportText);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Clear all tasks?')) {
        items = [{ text: '', checked: false }];
        saveItems();
        renderList();
      }
    });

    renderList();
  </script>
</body>
</html>
